name: DevSecOps End to End pipline

on:
  workflow_dispatch:

jobs:
  # CI (continous Integraion with security scanning)
  code-quality:  
    uses: ./.github/workflows/code-quality.yml

  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml
    secrets: inherit

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml
  
  docker-scan:
    uses:  ./.github/workflows/docker-lint.yml
    secrets: inherit
    
  # Build once the Security Scanns are complete
  build:
    needs: [code-quality, secrets-scan, dependency-scan, docker-scan]
    uses: ./.github/workflows/build-and-push.yml
    secrets: inherit

  trivy:
    needs: [build]
    uses: ./.github/workflows/image-scan.yml
    secrets: inherit


