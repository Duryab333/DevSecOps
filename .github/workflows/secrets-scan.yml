# API keys, sensitive date, credentials
# GitLeaks
name: Secrets Scan

on:
  workflow_call:

jobs:
  scecrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run GitLeaks Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # github acitons manages it 


