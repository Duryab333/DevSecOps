# Uses Trivy image scanner for CVEs
name: Image Scanner

on: 
  workflow_call:

jobs:
  image-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{secrets.DOCKERHUB_USERNAME}}/github-actions-app:${{ github.sha }}'
          exit-code: '1'
          #ignore-unfixed: true
          #vuln-type: 'os,library'
          severity: 'CRITICAL'